<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Maestro Integrado</title>
  
  <!-- LIBRERÍAS EXTERNAS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- TODO EL CSS EMBEBIDO AQUÍ -->
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --accent-orange: #d97706;
      --accent-orange-hover: #b45309;
      --accent-purple: #9333ea;
      --accent-purple-hover: #7e22ce;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --info-bg: #f0f9ff;
      --info-border: #bae6fd;
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); font-size: 13px; line-height: 1.4; }

    /* LOGIN */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: radial-gradient(circle at top, #ffffff, var(--bg-main)); padding: 20px; }
    .login-card { background: var(--bg-card); width: 100%; max-width: 390px; padding: 40px 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center; }
    .login-icon { width: 52px; height: 52px; background: var(--primary); color: #ffffff; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 22px; }
    .login-card h2 { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
    .login-card .subtitle { color: var(--text-light); font-size: 13px; margin-bottom: 24px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i { position: absolute; left: 12px; color: var(--text-light); font-size: 14px; }
    .input-wrapper input, .form-input, .form-select { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 12.5px; outline: none; }
    .form-input, .form-select { padding-left: 12px; }

    /* DASHBOARD */
    .dashboard-container { display: flex; flex-direction: column; min-height: 100vh; }
    .main-header { height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; sticky: top; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .system-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; background: var(--text-main); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

    .app-body { display: flex; flex: 1; }
    .sidebar { width: 230px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; }
    .nav-label { font-size: 10px; font-weight: 700; color: var(--text-light); padding: 0 20px 8px; }
    .nav-item { display: flex; align-items: center; padding: 9px 20px; color: var(--text-muted); text-decoration: none; font-size: 12.5px; font-weight: 500; gap: 12px; border-left: 3px solid transparent; }
    .nav-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

    .main-content { flex: 1; padding: 24px; overflow-y: auto; }
    .grid-layout { display: grid; grid-template-columns: 430px 1fr; gap: 20px; }
    .grid-full { grid-column: 1 / -1; }
    .card { background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow-sm); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-header h2 { font-size: 15px; font-weight: 700; color: var(--text-main); }

    /* BOTONES Y PASOS */
    .btn-primary { background: var(--primary); color: #ffffff; border: none; padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    .btn-secondary { background: #ffffff; border: 1px solid var(--border-strong); color: var(--text-muted); border-radius: var(--radius-sm); padding: 9px 14px; font-weight: 600; cursor: pointer; }
    .btn-action-orange { background: var(--accent-orange); color: #ffffff; border: none; padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    .btn-action-purple { background: var(--accent-purple); color: #ffffff; border: none; padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    .btn-block { width: 100%; display: block; }

    .steps-tabs { display: flex; background: var(--bg-subtle); border-radius: var(--radius-md); padding: 4px; margin-bottom: 14px; border: 1px solid var(--border); }
    .step-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 0; cursor: pointer; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px; color: var(--text-light); }
    .step-number { width: 22px; height: 22px; border-radius: 50%; background: var(--border-strong); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; }
    .step-tab.active { background: #ffffff; color: var(--accent-orange); box-shadow: var(--shadow-sm); }
    .step-tab.active .step-number { background: var(--accent-orange); }

    /* TABLAS */
    .table-container { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11.5px; text-align: left; }
    .data-table th { background: var(--bg-subtle); color: var(--text-muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--bg-subtle); color: var(--text-muted); }

    .badge-tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-cyan { background: #cff4fc; color: #055160; }
    .status-indicator { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
    .status-generating { color: var(--primary); }
    .status-success { color: var(--success); }
    .status-pill { padding: 3px 10px; border-radius: 12px; font-weight: 600; font-size: 10.5px; }
    .pill-success { background: var(--success-bg); color: var(--success); }

    .tree-container { max-height: 180px; overflow-y: auto; background: var(--bg-subtle); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px; }
    .tree-container ul { list-style: none; padding-left: 8px; }
    .tree-node { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 11.5px; }
    .tree-node .toggle { color: var(--primary); font-weight: 700; cursor: pointer; }
    .info-banner { background: var(--info-bg); border: 1px solid var(--info-border); color: #0369a1; padding: 9px 12px; border-radius: var(--radius-sm); font-size: 11.5px; margin-bottom: 12px; }
    .purple-box { background: #faf5ff; border: 1px solid #e9d5ff; padding: 12px; border-radius: var(--radius-sm); }
    .mt-5 { margin-top: 5px; } .mt-10 { margin-top: 10px; } .mt-15 { margin-top: 15px; }
    .row-buttons { display: flex; gap: 8px; } .row-buttons button { flex: 1; }
  </style>
</head>
